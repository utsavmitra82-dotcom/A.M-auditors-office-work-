<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Create account | A.M Auditors &amp; Tax Consultant</title>
    <link rel="stylesheet" href="./css/singin.css">
</head>
<body>
    <main class="signin-card">
        <a class="brand" href="./index.html" aria-label="A.M Auditors and Tax Consultant home">
            <span class="brand-mark" aria-hidden="true">A.M</span>
            <span class="brand-name">A.M Auditors &amp; Tax Consultant</span>
        </a>

        <h1>Create an account</h1>
        <p class="intro">Enter your details to get started.</p>

        <form id="signin-form">
            <div class="field">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-field">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button class="password-toggle" type="button" id="password-toggle" aria-label="Show password" aria-pressed="false">
                        Show
                    </button>
                </div>
            </div>

            <button class="submit-button" type="submit">Create account</button>
            <p class="status" id="signin-status" role="status" aria-live="polite"></p>
        </form>

        <p class="account-link">Already have an account? <a href="./login.html">Log in</a></p>
        <a class="back-link" href="./index.html">Back to home</a>
    </main>

    <script src="./js/singin.js" defer></script>
</body>
</html>
