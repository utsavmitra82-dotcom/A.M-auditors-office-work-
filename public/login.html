<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Login | A.M Auditors &amp; Tax Consultant</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">A.M</div>
        <h1>Welcome back</h1>
        <p class="intro">Sign in to A.M Auditors &amp; Tax Consultant.</p>

        <form id="login-form">
            <div class="field">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>
            <button type="submit">Log in</button>
            <p class="status" id="login-status" role="status" aria-live="polite"></p>
        </form>

        <a class="back-link" href="./index.html">Back to home</a>
    </main>
    <script src="./js/login.js" defer></script>
</body>
</html>
